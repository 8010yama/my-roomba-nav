# AMCL：保存した地図と LiDAR を見比べて、地図の上のどこにいるかを推定する（map → odom の TF を出す）
amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link            # Nav2 の標準は base_footprint なので書き換え
    scan_topic: /scan_fixed             # ノイズを消した 500 点のスキャン
    tf_broadcast: true
    transform_tolerance: 1.0
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # オドメトリ（EKF）がどれくらいずれるか。大きいほど LiDAR を信じる
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    # LiDAR（LD19：12 m まで、ロボット自身が映る 0.15 m より近い点は使わない）
    laser_model_type: "likelihood_field"
    laser_min_range: 0.15
    laser_max_range: 12.0
    max_beams: 90
    laser_likelihood_max_dist: 2.0
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    # 粒子（位置の候補）の数
    min_particles: 500
    max_particles: 3000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    # 狭い部屋なので、少し動いただけでも位置を更新する
    update_min_d: 0.05                  # [m]
    update_min_a: 0.1                   # [rad]
    save_pose_rate: 0.5
    # 起動したとき「地図を作り始めた場所（地図の原点）」にいるとみなす。違う場所なら Foxglove で /initialpose
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    always_reset_initial_pose: false
    first_map_only: false
